<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Project Viewer v2 - Large Assets</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
        }

        .container {
            display: grid; grid-template-rows: repeat(6, 1fr);
            width: 100vw; height: 100vh;
        }
        .row {
            position: relative; display: flex; align-items: center;
            overflow: hidden; background-color: #ffffff;
            transition: background 0.5s ease;
        }

        .btn-container { position: absolute; left: 30px; z-index: 100; }
        .nav-btn {
            width: 45px; height: 45px; border-radius: 50%;
            border: 0.8px solid #000; background: transparent;
            color: #000; font-size: 18px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .nav-btn.active { background-color: #000; color: #fff; }

        /* 이미지 크기 1.3배 상향 조정 */
        .image-track {
            position: absolute; display: flex; 
            gap: 100px; /* 크기에 맞춰 간격도 소폭 확장 */
            will-change: transform; white-space: nowrap;
        }
        .image-track img { 
            height: 143px; /* 기존 110px * 1.3 = 143px */
            width: auto; 
            object-fit: contain; 
        }

        /* 화면 보호기 (Puzzle Mode) */
        .row.idle-mode {
            background-image: url('puzzle.webp');
            background-size: 100vw 100vh;
            background-repeat: no-repeat;
            animation: wobble 6s ease-in-out infinite alternate;
        }
        .row:nth-child(1).idle-mode { background-position: 0 0%; }
        .row:nth-child(2).idle-mode { background-position: 0 20%; }
        .row:nth-child(3).idle-mode { background-position: 0 40%; }
        .row:nth-child(4).idle-mode { background-position: 0 60%; }
        .row:nth-child(5).idle-mode { background-position: 0 80%; }
        .row:nth-child(6).idle-mode { background-position: 0 100%; }

        @keyframes wobble {
            from { transform: translateX(-20px); }
            to { transform: translateX(20px); }
        }

        #video-container {
            position: fixed; bottom: 20px; right: 20px;
            width: 160px; height: 120px; border: 1px solid #eee;
            z-index: 1000; border-radius: 10px; overflow: hidden;
            background: #000; transform: scaleX(-1); opacity: 0.7;
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        #status-bar {
            position: fixed; bottom: 150px; right: 20px;
            width: 160px; height: 6px; background: #eee;
            border-radius: 3px; z-index: 1000;
        }
        #status-fill { width: 0%; height: 100%; background: #000; transition: width 0.1s; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="row"><div class="btn-container"><button class="nav-btn" onclick="loadProject(1)">1</button></div></div>
        <div class="row"></div>
        <div class="row"><div class="btn-container"><button class="nav-btn" onclick="loadProject(2)">2</button></div></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"><div class="btn-container"><button class="nav-btn" onclick="loadProject(3)">3</button></div></div>
    </div>

    <div id="status-bar"><div id="status-fill"></div></div>
    <div id="video-container"><video id="webcam" autoplay playsinline></video></div>

    <script>
        const ROW_DURATIONS = [36, 45, 30, 54, 42, 48]; 
        
        const rows = document.querySelectorAll('.row');
        let activeAnimations = [];
        let idleTimer;
        let isIdle = false;

        function loadProject(projectNum) {
            exitIdleMode();
            clearAll();
            resetIdleTimer();

            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.toggle('active', i === projectNum - 1);
            });

            rows.forEach((row, index) => {
                const track = document.createElement('div');
                track.className = 'image-track';
                const imgSources = [];

                if (projectNum === 1) {
                    for (let i = 1; i <= 23; i++) imgSources.push(`logo-${i}.png`);
                } else if (projectNum === 2) {
                    for (let i = 1; i <= 40; i++) imgSources.push(`p1-${String(i).padStart(2, '0')}.png`);
                } else if (projectNum === 3) {
                    for (let i = 3; i <= 147; i++) imgSources.push(`p2-${String(i).padStart(2, '0')}.png`);
                }

                imgSources.sort(() => Math.random() - 0.5);
                imgSources.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.onerror = () => img.remove();
                    track.appendChild(img);
                });

                row.appendChild(track);
                animate(track, ROW_DURATIONS[index]);
            });
        }

        function animate(el, duration) {
            const parentWidth = el.parentElement.offsetWidth;
            const elWidth = el.scrollWidth || 2500;
            el.style.transition = 'none';
            el.style.transform = `translateX(${-elWidth}px)`;
            setTimeout(() => {
                el.style.transition = `transform ${duration}s linear`;
                el.style.transform = `translateX(${parentWidth}px)`;
            }, 50);
            const loop = setTimeout(() => animate(el, duration), (duration * 1000) + 100);
            activeAnimations.push(loop);
        }

        function clearAll() {
            activeAnimations.forEach(clearTimeout);
            activeAnimations = [];
            rows.forEach(row => {
                const track = row.querySelector('.image-track');
                if(track) track.remove();
            });
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (!isIdle) {
                idleTimer = setTimeout(enterIdleMode, 15000); 
            }
        }

        function enterIdleMode() {
            isIdle = true;
            clearAll();
            rows.forEach(row => row.classList.add('idle-mode'));
        }

        function exitIdleMode() {
            isIdle = false;
            rows.forEach(row => row.classList.remove('idle-mode'));
        }

        const videoElement = document.getElementById('webcam');
        const statusFill = document.getElementById('status-fill');
        let gestureTimer = 0;
        let lastGesture = -1;

        function onResults(results) {
            let currentGesture = -1;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                resetIdleTimer();
                const lm = results.multiHandLandmarks[0];
                
                const distO = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                const isIndexUp = lm[8].y < lm[6].y;
                const isMiddleUp = lm[12].y < lm[10].y;
                const isRingDown = lm[16].y > lm[14].y;
                const isPinkyDown = lm[20].y > lm[18].y;

                if (distO < 0.05) {
                    currentGesture = 2; // 3번
                } else if (isIndexUp && isMiddleUp && isRingDown && isPinkyDown) {
                    currentGesture = 1; // 2번 (브이)
                } else {
                    currentGesture = 0; // 1번 (정지)
                }

                if (currentGesture === lastGesture && currentGesture !== -1) {
                    gestureTimer += 40; 
                    statusFill.style.width = (gestureTimer / 1000 * 100) + "%";
                    
                    if (gestureTimer >= 1000) { // 1초
                        loadProject(currentGesture + 1);
                        gestureTimer = 0;
                    }
                } else {
                    gestureTimer = 0;
                    statusFill.style.width = "0%";
                }
                lastGesture = currentGesture;
            } else {
                gestureTimer = 0;
                statusFill.style.width = "0%";
            }
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });
        camera.start();
        resetIdleTimer();
    </script>
</body>
</html>
