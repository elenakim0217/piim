<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaerin Kim Portfolio</title>

  <style>
    @font-face {
      font-family: "Wanted Sans";
      src: local("Wanted Sans Regular");
      font-weight: 400;
    }

    @font-face {
      font-family: "Gotham";
      src: local("Gotham Regular");
      font-weight: 400;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --main-color: #1c1c1c;
      --header-color: #1c1c1c;
    }

    html,
    body {
      width: 100%;
      background: #fff;
      color: var(--main-color);
      overflow-x: hidden;
      font-family: "Gotham", "Wanted Sans", sans-serif;
      font-size: 11.5pt;
      font-weight: 400;
    }

    body {
      word-break: keep-all;
    }

    b {
      font-weight: 400;
    }

    header {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      z-index: 9000;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      pointer-events: none;
      color: var(--header-color);
    }

    header button,
    header a,
    .email-wrap,
    .logo-wrap {
      pointer-events: auto;
    }

    .logo-wrap {
      justify-self: start;
      position: relative;
      width: 280px;
      height: 20px;
      cursor: pointer;
    }

    .logo,
    .logo-hint,
    .click-link,
    .email,
    .sound-hint {
      font-family: "Gotham", "Wanted Sans", sans-serif;
      font-size: 11.5pt;
      font-weight: 400;
      color: var(--header-color);
      text-decoration: underline;
      text-underline-offset: 3px;
      background: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1;
    }

    .logo,
    .logo-hint {
      position: absolute;
      top: 0;
      left: 0;
    }

    .logo {
      opacity: 1;
    }

    .logo-hint {
      opacity: 0;
      pointer-events: none;
      font-family: "Wanted Sans", sans-serif;
      font-size: 12pt;
    }

    .logo-wrap.logo-hint-active .logo {
      opacity: 0;
    }

    .logo-wrap.logo-hint-active .logo-hint {
      opacity: 1;
    }

    .click-link {
      justify-self: center;
    }

    .email-wrap {
      justify-self: end;
      position: relative;
      width: 210px;
      height: 20px;
      text-align: right;
      cursor: pointer;
    }

    .email,
    .sound-hint {
      position: absolute;
      top: 0;
      right: 0;
    }

    .email {
      opacity: 1;
    }

    .sound-hint {
      opacity: 0;
      pointer-events: none;
    }

    .email-wrap.hint-active .email {
      opacity: 0;
    }

    .email-wrap.hint-active .sound-hint {
      opacity: 1;
    }

    .hero {
      width: 100vw;
      height: 100vh;
      background-image: url("bg1.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
    }

    .project-menu {
  width: 100vw;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: #1c1c1c;
}

.project-btn {
  padding: 18px 0;
  background: #1c1c1c;
  border: none;
  font-family: "Gotham", sans-serif;
  font-size: 11.5pt;
  font-weight: 400;
  color: #ffffff;
  cursor: pointer;
  text-decoration: none;
}

.project-btn.active {
  color: #ffffff;
  text-decoration: underline;
  text-underline-offset: 3px;
}

    .portfolio-images {
      width: 100vw;
      background: #fff;
    }

    .portfolio-images img,
    .profile-images img {
      display: block;
      width: 100vw;
      height: auto;
    }

    .profile-popup {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 8000;
      display: none;
      overflow-y: auto;
    }

    .profile-popup.active {
      display: block;
    }

    .profile-inner {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #fff;
    }

    .profile-column {
      width: 100%;
      min-height: 100vh;
      padding: 72px 48px 48px 48px;
      text-align: left;
      font-family: "Wanted Sans", sans-serif;
      font-size: 12pt;
      font-weight: 400;
      line-height: 1.58;
      letter-spacing: -0.015em;
      color: var(--main-color);
      background: #fff;
      word-break: keep-all;
    }

    .profile-title {
      margin-bottom: 18px;
      font-family: "Wanted Sans", sans-serif;
      font-size: 12pt;
      font-weight: 400;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .profile-name {
      font-family: "Gotham", sans-serif;
      font-size: 11.5pt;
      font-weight: 400;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .profile-images {
      width: 100vw;
      background: #fff;
    }

    @media (max-width: 768px) {
      .profile-inner {
        grid-template-columns: 1fr;
      }

      .profile-column {
        min-height: auto;
        padding: 64px 24px 24px 24px;
      }

      .project-menu {
        grid-template-columns: repeat(5, 1fr);
      }
    }
  </style>
</head>

<body>
  <audio id="bgSound" src="sound.mp3" loop></audio>

  <header>
    <div id="logoWrap" class="logo-wrap" onclick="toggleProfile()">
      <button class="logo">Chaerin Kim</button>
      <div class="logo-hint">채책은 어디서든 넘나들고 파고듭니다</div>
    </div>

    <a
      class="click-link"
      href="https://www.behance.net/gallery/251212373/-Chaerin-Kim-2026-"
      target="_blank"
    >
      Click Here
    </a>

    <div id="emailWrap" class="email-wrap" onclick="playSound()">
      <button class="email">e.chaerinkim@gmail.com</button>
      <div class="sound-hint">Turn on the sound!</div>
    </div>
  </header>

  <main>
    <section id="hero" class="hero" onclick="randomBg()"></section>

    <section class="project-menu">
      <button class="project-btn active" onclick="renderGallery(0)">01</button>
      <button class="project-btn" onclick="renderGallery(1)">02</button>
      <button class="project-btn" onclick="renderGallery(2)">03</button>
      <button class="project-btn" onclick="renderGallery(3)">04</button>
      <button class="project-btn" onclick="renderGallery(4)">05</button>
    </section>

    <section id="portfolioImages" class="portfolio-images"></section>
  </main>

  <section id="profilePopup" class="profile-popup">
    <div class="profile-inner">
      <div class="profile-column">
        <div class="profile-title">채책</div>
        <p>
          채책은 김채린 외 2인 이상 함께하며 다양한 활동이 펼쳐지는 자유로운 소통의 공간이자 모임입니다.
          서울 및 경기도 중심으로 미학 판단에서 영감을 얻어 실험적인 그래픽을 작업합니다.
        </p>
      </div>

      <div class="profile-column">
        <div class="profile-title">
          2026 <span class="profile-name">Chaerin Kim</span>
        </div>
        <p>
          어디든지 넘나들고 파고듭니다. 완전하거나 불완전해도 상관없습니다.
          책 외에 여러 매체를 넘나드는 시각 매개 현상을 통해 실험적 공간을 펼치며,
          오직 최소한의 이미지 안에 최대의 시각 경험을 상상하도록 유도합니다.
        </p>
      </div>
    </div>

    <div class="profile-images">
      <img src="w2.jpg" alt="profile image 2" />
      <img src="w3.jpg" alt="profile image 3" />
    </div>
  </section>

  <script>
    const bgImages = ["bg1.png", "bg2.png", "bg3.png", "bg4.png"];
    let currentBg = "bg1.png";

    const hero = document.getElementById("hero");

    function randomBg() {
      let nextBg = currentBg;

      while (nextBg === currentBg && bgImages.length > 1) {
        const randomIndex = Math.floor(Math.random() * bgImages.length);
        nextBg = bgImages[randomIndex];
      }

      currentBg = nextBg;
      hero.style.backgroundImage = `url("${currentBg}")`;
      updateHeaderColorFromImage(currentBg);
    }

    const galleries = [
      { start: 5, end: 16 },
      { start: 17, end: 34 },
      { start: 35, end: 51 },
      { start: 52, end: 70 },
      { start: 71, end: 94 }
    ];

    function renderGallery(index) {
      const gallery = galleries[index];
      const container = document.getElementById("portfolioImages");
      const buttons = document.querySelectorAll(".project-btn");

      container.innerHTML = "";

      buttons.forEach((button) => button.classList.remove("active"));
      buttons[index].classList.add("active");

      for (let i = gallery.start; i <= gallery.end; i++) {
        const img = document.createElement("img");
        img.src = `w${i}.jpg`;
        img.alt = `portfolio image ${i}`;
        container.appendChild(img);
      }

      updateHeaderColorByScroll();
    }

    function setHeaderColor(color) {
      document.documentElement.style.setProperty("--header-color", color);
    }

    function updateHeaderColorFromImage(src) {
      const img = new Image();
      img.src = src;

      img.onload = function () {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = 20;
        canvas.height = 20;
        ctx.drawImage(img, 0, 0, 20, 20);

        const data = ctx.getImageData(0, 0, 20, 20).data;
        let r = 0;
        let g = 0;
        let b = 0;
        let count = 0;

        for (let i = 0; i < data.length; i += 4) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }

        r = r / count;
        g = g / count;
        b = b / count;

        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        setHeaderColor(brightness < 130 ? "#fff" : "#1c1c1c");
      };

      img.onerror = function () {
        setHeaderColor("#1c1c1c");
      };
    }

    function updateHeaderColorByScroll() {
      const profileOpen = document.getElementById("profilePopup").classList.contains("active");

      if (profileOpen) {
        setHeaderColor("#1c1c1c");
        return;
      }

      if (window.scrollY < window.innerHeight * 0.8) {
        updateHeaderColorFromImage(currentBg);
      } else {
        setHeaderColor("#1c1c1c");
      }
    }

    function toggleProfile() {
      const profile = document.getElementById("profilePopup");

      if (profile.classList.contains("active")) {
        profile.classList.remove("active");
        document.body.style.overflow = "auto";
        updateHeaderColorByScroll();
      } else {
        profile.classList.add("active");
        document.body.style.overflow = "hidden";
        setHeaderColor("#1c1c1c");
      }
    }

    const sound = document.getElementById("bgSound");

    function playSound() {
      sound.play();
    }

    const emailWrap = document.getElementById("emailWrap");

    setInterval(() => {
      emailWrap.classList.add("hint-active");

      setTimeout(() => {
        emailWrap.classList.remove("hint-active");
      }, 1200);
    }, 3000);

    const logoWrap = document.getElementById("logoWrap");

    setInterval(() => {
      logoWrap.classList.add("logo-hint-active");

      setTimeout(() => {
        logoWrap.classList.remove("logo-hint-active");
      }, 1400);
    }, 5000);

    window.addEventListener("scroll", updateHeaderColorByScroll);

    window.addEventListener("load", () => {
      currentBg = "bg1.png";
      hero.style.backgroundImage = `url("${currentBg}")`;

      sound.currentTime = 0;
      sound.play().catch(() => {});

      renderGallery(0);
      updateHeaderColorFromImage(currentBg);
    });
  </script>
</body>
</html>
