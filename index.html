<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChaerinKim Portfolio</title>

  <style>
    @font-face {
      font-family: "Wanted Sans";
      src: local("Wanted Sans Medium");
      font-weight: 500;
    }

    @font-face {
      font-family: "Gotham";
      src: local("Gotham Medium");
      font-weight: 500;
    }

    @font-face {
      font-family: "Gotham";
      src: local("Gotham Bold");
      font-weight: 700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      color: #000;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 100;
    }

    .logo {
      font-family: "Gotham", sans-serif;
      font-weight: 700;
      font-size: 12pt;
      letter-spacing: -0.01em;
      cursor: pointer;
      background: none;
      border: none;
      color: #000;
    }

    main {
      width: 100%;
    }

    .portfolio-image {
      display: block;
      width: 100vw;
      height: auto;
    }

    .profile-popup {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 999;
      display: none;
    }

    .profile-popup.active {
      display: flex;
    }

    .profile-inner {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .profile-column {
      padding: 72px 48px 48px 48px;
      text-align: left;
      font-family: "Wanted Sans", sans-serif;
      font-weight: 500;
      font-size: 12pt;
      line-height: 1.58;
      letter-spacing: -0.015em;
      word-break: keep-all;
    }

    .profile-title {
      display: block;
      margin-bottom: 18px;
      font-family: "Wanted Sans", sans-serif;
      font-weight: 500;
      font-size: 12pt;
    }

    .english-bold {
      font-family: "Gotham", sans-serif;
      font-weight: 700;
      font-size: 12pt;
    }

    .close-btn {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 1000;
      font-family: "Gotham", sans-serif;
      font-weight: 500;
      font-size: 18px;
      line-height: 1;
      background: none;
      border: none;
      color: #000;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .profile-inner {
        grid-template-columns: 1fr;
      }

      .profile-column {
        padding: 64px 24px 24px 24px;
      }
    }
  </style>
</head>

  <section id="profilePopup" class="profile-popup">
    <button class="close-btn" onclick="closeProfile()">×</button>

    <div class="profile-inner">
      <div class="profile-column">
        <span class="profile-title">채책</span>
        채책은 김채린 외 2인 이상 함께하며 다양한 활동이 펼쳐지는 자유로운 소통의 공간이자 모임입니다.
        서울 및 경기도 중심으로 미학 판단에서 영감을 얻어 실험적인 그래픽을 작업합니다.
      </div>

      <div class="profile-column">
        <span class="profile-title">
          2026 <span class="english-bold">Chaerin Kim</span>
        </span>
        어디든지 넘나들고 파고듭니다. 완전하거나 불완전해도 상관없습니다.
        책 외에 여러 매체를 넘나드는 시각 매개 현상을 통해 실험적 공간을 펼치며,
        오직 최소한의 이미지 안에 최대의 시각 경험을 상상하도록 유도합니다.
      </div>
    </div>
  </section>

  <script>
    function openProfile() {
      document.getElementById("profilePopup").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeProfile() {
      document.getElementById("profilePopup").classList.remove("active");
      document.body.style.overflow = "auto";
    }
  </script>
