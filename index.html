<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Show!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
        }

        .container {
            display: grid; grid-template-rows: repeat(6, 1fr);
            width: 100vw; height: 100vh;
        }
        .row {
            position: relative; display: flex; align-items: center;
            overflow: hidden; background-color: #ffffff;
        }

        /* 1. 버튼 크기 대폭 축소 (15px) */
        .btn-container { position: absolute; left: 25px; z-index: 100; }
        .nav-btn {
            width: 15px; height: 15px; border-radius: 50%;
            border: 0.5px solid #000; background: transparent;
            color: #000; font-size: 8px; font-weight: 400;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
            line-height: 1;
        }
        /* 활성화 시 배경색만 채움 */
        .nav-btn.active { background-color: #000; color: #fff; }

        .image-track {
            position: absolute; display: flex; gap: 100px;
            will-change: transform; white-space: nowrap;
        }
        .image-track img { height: 143px; width: auto; object-fit: contain; }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div class="row"><div class="btn-container"><button class="nav-btn" id="btn-1" onclick="manualControl(1)">i</button></div></div>
        <div class="row"></div>
        <div class="row"><div class="btn-container"><button class="nav-btn" id="btn-2" onclick="manualControl(2)">ii</button></div></div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row"><div class="btn-container"><button class="nav-btn" id="btn-3" onclick="manualControl(3)">iii</button></div></div>
    </div>

    <script>
        /**
         * [설정 포인트]
         * 1. ROW_DURATIONS: 각 칸의 기본 이동 시간 (초)
         * 2. SPEED_MULTIPLIER: 프로젝트별 속도 보정 (3번은 이미지가 많으므로 큰 숫자 부여)
         */
        const ROW_DURATIONS = [36, 45, 30, 54, 42, 48]; 
        
        const SPEED_MULTIPLIER = {
            1: 1,   
            2: 1.5, 
            3: 12    // 3번 프로젝트는 이미지가 많아 12배 더 천천히 움직이도록 설정
        };

        const rows = document.querySelectorAll('.row');
        let activeAnimations = [];
        let currentProject = 1;
        let cycleTimer;

        function loadProject(projectNum) {
            clearAll();
            currentProject = projectNum;

            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.toggle('active', i === projectNum - 1);
            });

            rows.forEach((row, index) => {
                const track = document.createElement('div');
                track.className = 'image-track';
                const imgSources = [];

                if (projectNum === 1) {
                    for (let i = 1; i <= 23; i++) imgSources.push(`logo-${i}.png`);
                } else if (projectNum === 2) {
                    for (let i = 1; i <= 40; i++) imgSources.push(`p1-${String(i).padStart(2, '0')}.png`);
                } else if (projectNum === 3) {
                    // p2-3.png ~ p2-147.png 형태
                    for (let i = 3; i <= 147; i++) imgSources.push(`p2-${i}.png`);
                }

                imgSources.sort(() => Math.random() - 0.5);
                imgSources.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.onerror = () => img.remove();
                    track.appendChild(img);
                });

                row.appendChild(track);

                const finalDuration = ROW_DURATIONS[index] * SPEED_MULTIPLIER[projectNum];
                animate(track, finalDuration);
            });
        }

        function animate(el, duration) {
            const parentWidth = el.parentElement.offsetWidth;
            const elWidth = el.scrollWidth || 3000;
            el.style.transition = 'none';
            el.style.transform = `translateX(${-elWidth}px)`;
            setTimeout(() => {
                el.style.transition = `transform ${duration}s linear`;
                el.style.transform = `translateX(${parentWidth}px)`;
            }, 50);
            const loop = setTimeout(() => animate(el, duration), (duration * 1000) + 100);
            activeAnimations.push(loop);
        }

        function clearAll() {
            activeAnimations.forEach(clearTimeout);
            activeAnimations = [];
            rows.forEach(row => {
                const track = row.querySelector('.image-track');
                if(track) track.remove();
            });
        }

        function startCycle() {
            loadProject(currentProject);
            cycleTimer = setInterval(() => {
                currentProject = (currentProject % 3) + 1;
                loadProject(currentProject);
            }, 30000); 
        }

        function manualControl(num) {
            clearInterval(cycleTimer);
            loadProject(num);
            currentProject = num;
            cycleTimer = setInterval(() => {
                currentProject = (currentProject % 3) + 1;
                loadProject(currentProject);
            }, 30000);
        }

        window.onload = startCycle;
    </script>
</body>
</html>
